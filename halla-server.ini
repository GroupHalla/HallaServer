# Configuração do Halla Server
[server]
# 1–80 caracteres. Alterações manuais neste valor têm prioridade no próximo
# início, mesmo que o banco ainda contenha o nome anterior.
name = Servidor Halla
motd = Bem-vindo ao servidor Halla!
port = 9987
maxClients = 32

# Caminhos TLS. Se ambos ficarem vazios, cert.pem/key.pem autoassinados são
# gerados ao lado deste INI. Para Let's Encrypt, configure os dois.
certFile =
keyFile =

# Segredos também podem vir de HALLA_SERVER_PASSWORD e HALLA_ADMIN_PASSWORD.
password =
adminPassword =

privilegeKeys =
privilegeKeyReuse = false
allowScreenShare = false
# Limites máximos oferecidos nos seletores de qualidade Desktop/Mobile.
screenshareWidth = 1920
screenshareHeight = 1080
screenshareFps = 60
screenshareBitrateKbps = 8000

# ICE usado por Desktop e Mobile. TURN é necessário para NAT/firewall restritivo.
# Segredos TURN podem vir de HALLA_TURN_URL, HALLA_TURN_USERNAME e HALLA_TURN_PASSWORD.
[webrtc]
stunUrls = stun:stun.l.google.com:19302
turnUrl =
turnUsername =
turnPassword =

# Administração remota. Seguro por padrão: desligado e bind local.
# Ao habilitar, usa o mesmo TLS do controle. HALLA_QUERY_PASSWORD tem prioridade.
[query]
port = 0
bind = 127.0.0.1
user = serveradmin
password =

[database]
type = sqlite
host = localhost
port = 3306
name = halla_db
user = root
# HALLA_DATABASE_PASSWORD tem prioridade.
password =
