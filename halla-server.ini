# Configuração do Halla Server
[server]
# Nome exibido no topo da árvore do cliente
name = Servidor Halla

# Mensagem de boas-vindas (MOTD)
motd = Bem-vindo ao servidor Halla!

# Porta de controle (TCP) e voz (UDP) — mesma numeração
port = 9987

# Máximo de clientes simultâneos (slots)
maxClients = 32

# Senha para entrar no servidor (deixe vazio para servidor público)
password =

# Senha de administrador: quem conectar com ela entra como "admin"
adminPassword = troque-esta-senha

# Chaves de privilégio (separadas por vírgula).
# Formato: CHAVE (concede o grupo "admin") ou CHAVE@grupo (ex.: @normal)
# Se deixado em branco, o servidor gera automaticamente uma chave única de administrador no console e a salva no banco de dados!
privilegeKeys =

# Se false (padrão), cada chave de privilégio só pode ser usada UMA vez
privilegeKeyReuse = false

# Permitir compartilhamento de tela de computadores (true ou false)
allowScreenShare = true

# ---- ServerQuery (administração remota em texto, estilo TS3 ServerQuery)
# 0 = desligado. Conecte com: telnet <ip> 10011
# Na 1ª execução sem senha definida, uma senha é gerada e mostrada no console.
[query]
port = 10011
user = serveradmin
password =

# ---- Configuração de Banco de Dados (SQLite ou MySQL/MariaDB)
# Tipo suportado: sqlite ou mysql
[database]
type = sqlite
# Para SQLite, o arquivo é definido automaticamente (halla-data.db).
# Para MySQL/MariaDB, configure as linhas abaixo:
host = localhost
port = 3306
name = halla_db
user = root
password =
