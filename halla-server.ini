# Configuração do Halla Server
[server]
# Nome exibido no topo da árvore do cliente
name = Servidor Halla

# Mensagem de boas-vindas (MOTD)
motd = Bem-vindo ao servidor Halla!

# Porta de controle (TCP) e voz (UDP) — mesma numeração
port = 9987

# Máximo de clientes simultâneos (slots)
maxClients = 32

# Senha para entrar no servidor (deixe vazio para servidor público)
password =

# Senha de administrador: quem conectar com ela entra como "admin"
adminPassword = troque-esta-senha

# Chaves de privilégio (separadas por vírgula) — tornam o usuário "admin"
privilegeKeys = HL3-AAAA-BBBB-CCCC, HL3-DDDD-EEEE-FFFF
