name: Build and Release Server

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Server
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-openssl

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/HallaServer
          cp build/halla-server.exe dist/HallaServer/
          cp halla-server.ini dist/HallaServer/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/HallaServer dist/HallaServer/halla-server.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/HallaServer/
          cp /mingw64/bin/libstdc++-6.dll dist/HallaServer/
          cp /mingw64/bin/libwinpthread-1.dll dist/HallaServer/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/HallaServer -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/HallaServer/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/HallaServer/
                    COPIED=true
                  fi
                fi
              done
            done
          done

      - name: Zip Windows Release
        run: |
          Compress-Archive -Path dist/HallaServer/* -DestinationPath halla-server-${{ github.ref_name }}-win64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-server-windows
          path: halla-server-${{ github.ref_name }}-win64.zip

  build-linux:
    name: Build Linux Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools build-essential libssl-dev libqt6sql6-sqlite libqt6sql6-mysql

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        run: |
          cmake --build build

      - name: Prepare Package
        run: |
          mkdir -p halla-server-linux
          mkdir -p halla-server-linux/sqldrivers
          mkdir -p halla-server-linux/tls
          cp build/halla-server halla-server-linux/
          cp halla-server.ini halla-server-linux/
          
          # Copia os plugins do Qt necessários em containers mínimos.
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/sqldrivers/libqsqlite.so halla-server-linux/sqldrivers/
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/sqldrivers/libqsqlmysql.so halla-server-linux/sqldrivers/
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/tls/*.so halla-server-linux/tls/
          
          # Copia as bibliotecas Qt 6 essenciais. QtNetwork do Ubuntu recente
          # depende de libproxy.so.1; containers Pterodactyl mínimos não têm essa
          # biblioteca. Por isso resolvemos recursivamente as dependências não
          # básicas dos binários/libs empacotados, sem copiar glibc/loader.
          cp /usr/lib/x86_64-linux-gnu/libQt6Core.so.6 halla-server-linux/
          cp /usr/lib/x86_64-linux-gnu/libQt6Network.so.6 halla-server-linux/
          cp /usr/lib/x86_64-linux-gnu/libQt6Sql.so.6 halla-server-linux/

          copy_runtime_deps() {
            local root="$1"
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              while IFS= read -r f; do
                while IFS= read -r dep; do
                  [ -n "$dep" ] || continue
                  [ -f "$dep" ] || continue
                  local base
                  base="$(basename "$dep")"
                  case "$base" in
                    linux-vdso*|ld-linux*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*)
                      continue ;;
                  esac
                  if [ ! -f "$root/$base" ]; then
                    echo "Copiando dependência runtime: $base"
                    cp -L "$dep" "$root/$base"
                    changed=1
                  fi
                done < <(ldd "$f" 2>/dev/null | awk '/=> \/.*\// {print $3} /^[[:space:]]*\// {print $1}')
              done < <(find "$root" -maxdepth 2 -type f)
            done
          }
          copy_runtime_deps halla-server-linux
          
          tar -czf halla-server-${{ github.ref_name }}-linux-x64.tar.gz halla-server-linux/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-server-linux
          path: halla-server-${{ github.ref_name }}-linux-x64.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64 Server
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools build-essential libssl-dev libqt6sql6-sqlite libqt6sql6-mysql
      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Prepare ARM64 Package
        run: |
          mkdir -p halla-server-linux-arm64/sqldrivers
          mkdir -p halla-server-linux-arm64/tls
          cp build/halla-server halla-server-linux-arm64/
          cp halla-server.ini halla-server-linux-arm64/
          cp /usr/lib/aarch64-linux-gnu/qt6/plugins/sqldrivers/libqsqlite.so halla-server-linux-arm64/sqldrivers/
          cp /usr/lib/aarch64-linux-gnu/qt6/plugins/sqldrivers/libqsqlmysql.so halla-server-linux-arm64/sqldrivers/
          cp /usr/lib/aarch64-linux-gnu/qt6/plugins/tls/*.so halla-server-linux-arm64/tls/
          
          # Copia as bibliotecas Qt 6 essenciais e dependências runtime
          # não básicas necessárias em containers Pterodactyl mínimos.
          cp /usr/lib/aarch64-linux-gnu/libQt6Core.so.6 halla-server-linux-arm64/
          cp /usr/lib/aarch64-linux-gnu/libQt6Network.so.6 halla-server-linux-arm64/
          cp /usr/lib/aarch64-linux-gnu/libQt6Sql.so.6 halla-server-linux-arm64/

          copy_runtime_deps() {
            local root="$1"
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              while IFS= read -r f; do
                while IFS= read -r dep; do
                  [ -n "$dep" ] || continue
                  [ -f "$dep" ] || continue
                  local base
                  base="$(basename "$dep")"
                  case "$base" in
                    linux-vdso*|ld-linux*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*)
                      continue ;;
                  esac
                  if [ ! -f "$root/$base" ]; then
                    echo "Copiando dependência runtime: $base"
                    cp -L "$dep" "$root/$base"
                    changed=1
                  fi
                done < <(ldd "$f" 2>/dev/null | awk '/=> \/.*\// {print $3} /^[[:space:]]*\// {print $1}')
              done < <(find "$root" -maxdepth 2 -type f)
            done
          }
          copy_runtime_deps halla-server-linux-arm64
          
          tar -czf halla-server-${{ github.ref_name }}-linux-arm64.tar.gz halla-server-linux-arm64/
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-server-linux-arm64
          path: halla-server-${{ github.ref_name }}-linux-arm64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-server-windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-server-linux
      - name: Download Linux ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-server-linux-arm64

      - name: Remover releases anteriores
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name == 'v1.0.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="GroupHalla/HallaServer"
          current="${GITHUB_REF_NAME}"
          for tag in $(gh release list --repo "$repo" --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$current" ]; then
              gh release delete "$tag" --repo "$repo" --cleanup-tag --yes
            fi
          done
          if gh release view "$current" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$current" --repo "$repo" --yes
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Server ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            halla-server-${{ github.ref_name }}-win64.zip
            halla-server-${{ github.ref_name }}-linux-x64.tar.gz
            halla-server-${{ github.ref_name }}-linux-arm64.tar.gz
          body: |
            ## Halla Server ${{ github.ref_name }}

            ### Correções
            * Corrige permissões padrão/migradas de escuta: clientes normais e Mobile agora recebem relay UDP de voz.
            * Preserva a checagem de listen no relay, mas adiciona listen/text_chat aos grupos antigos que não tinham esses campos.
            * Mantém identidade Ed25519 obrigatória e chaves de voz de 32 bytes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
