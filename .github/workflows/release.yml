name: Build and Release Server

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Server
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/HallaServer
          cp build/halla-server.exe dist/HallaServer/
          cp halla-server.ini dist/HallaServer/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/HallaServer dist/HallaServer/halla-server.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/HallaServer/
          cp /mingw64/bin/libstdc++-6.dll dist/HallaServer/
          cp /mingw64/bin/libwinpthread-1.dll dist/HallaServer/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/HallaServer -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/HallaServer/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/HallaServer/
                    COPIED=true
                  fi
                fi
              done
            done
          done

      - name: Zip Windows Release
        run: |
          Compress-Archive -Path dist/HallaServer/* -DestinationPath halla-server-3.2.7-win64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-server-windows
          path: halla-server-3.2.7-win64.zip

  build-linux:
    name: Build Linux Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools build-essential

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        run: |
          cmake --build build

      - name: Prepare Package
        run: |
          mkdir -p halla-server-linux
          cp build/halla-server halla-server-linux/
          cp halla-server.ini halla-server-linux/
          tar -czf halla-server-3.2.7-linux-x64.tar.gz halla-server-linux/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-server-linux
          path: halla-server-3.2.7-linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-server-windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-server-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.7
          name: Halla Server 3.2.7 — Persistência e Permissões Totais
          draft: false
          prerelease: false
          files: |
            halla-server-3.2.7-win64.zip
            halla-server-3.2.7-linux-x64.tar.gz
          body: |
            ## 🚀 Novidades e Melhorias do Halla Server 3.2.6

            Esta release corrige as chaves de exemplo do arquivo `.ini` que impediam a ativação da geração automática do primeiro privilégio.

            ### 🔑 Geração de Chaves de Privilégio (Estilo TS3)
            * **Chaves Autogeradas Nativamente:** O arquivo `halla-server.ini` de exemplo agora vem com o campo `privilegeKeys = ` limpo por padrão. Isso garante que o servidor gere de forma automática uma chave única e segura do tipo `HL3-XXXX-YYYY-ZZZZ-WWWW` na primeira execução, a salve no banco de dados e a exiba no console para obter privilégios totais de forma instantânea!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
